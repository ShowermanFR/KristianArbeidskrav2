! ============================================================
! Distribution router: ST2-D-RO1
! Generert av Ansible fra templates/distribution.j2
! Verdiene hentes fra host_vars/ST2-D-RO1.yml og group_vars/all.yml
! Management-porten (GigabitEthernet0/0/0) er satt av Python-scriptet og røres ikke her.
! ============================================================
hostname ST2-D-RO1
service password-encryption
!
interface GigabitEthernet0/0/1
 description Til ST2-A-SW1 Fa0/1 - VLAN 20
 ip address 10.2.20.2 255.255.255.0
 standby 20 ip 10.2.20.1
 standby 20 priority 110
 standby 20 preempt
!
ip dhcp excluded-address 10.2.20.1 10.2.20.99
ip dhcp excluded-address 10.2.20.150 10.2.20.254
!
ip dhcp pool VLAN20
 network 10.2.20.0 255.255.255.0
 default-router 10.2.20.1
!
router ospf 1
 router-id 2.2.2.2
 passive-interface GigabitEthernet0/0/1
 network 10.2.0.0 0.0.0.3 area 0
 network 10.2.20.0 0.0.0.255 area 0
