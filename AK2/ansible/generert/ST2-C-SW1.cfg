! ============================================================
! Core L3-switch: ST2-C-SW1
! Generert av Ansible fra templates/core.j2
! Verdiene hentes fra host_vars/ST2-C-SW1.yml og group_vars/all.yml
! Management-porten (GigabitEthernet1/0/1) er satt av Python-scriptet og røres ikke her.
! ============================================================
hostname ST2-C-SW1
service password-encryption
ip routing
!
interface GigabitEthernet1/0/2
 description Til ST2-D-RO1 Gi0/0/0
 no switchport
 ip address 10.2.0.1 255.255.255.252
!
interface GigabitEthernet1/0/3
 description Til ST2-D-RO2 Gi0/0
 no switchport
 ip address 10.2.0.5 255.255.255.252
!
router ospf 1
 router-id 2.2.2.1
 passive-interface default
 no passive-interface GigabitEthernet1/0/2
 no passive-interface GigabitEthernet1/0/3
 network 10.2.0.0 0.0.0.3 area 0
 network 10.2.0.4 0.0.0.3 area 0
 network 10.2.99.0 0.0.0.3 area 0
