! ============================================================
! Access switch: ST2-A-SW1
! Generert av Ansible fra templates/access.j2
! Verdiene hentes fra host_vars/ST2-A-SW1.yml og group_vars/all.yml
! Management (Vlan20) er satt av Python-scriptet og røres ikke her.
! VLAN-ene lages av egen task i playbooken (ios_vlans), ikke av malen.
! ============================================================
hostname ST2-A-SW1
service password-encryption
!
interface FastEthernet0/1
 description Til ST2-D-RO1 Gi0/0/1
 switchport mode access
 switchport access vlan 20
!
interface FastEthernet0/2
 description Til ST2-D-RO2 Gi0/1
 switchport mode access
 switchport access vlan 20
!
interface FastEthernet0/3
 description Trunk til ST2-A-SW2 Gi1/0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20
!
