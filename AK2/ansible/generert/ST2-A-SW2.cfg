! ============================================================
! Access switch: ST2-A-SW2
! Generert av Ansible fra templates/access.j2
! Verdiene hentes fra host_vars/ST2-A-SW2.yml og group_vars/all.yml
! Management (Vlan20) er satt av Python-scriptet og røres ikke her.
! VLAN-ene lages av egen task i playbooken (ios_vlans), ikke av malen.
! ============================================================
hostname ST2-A-SW2
service password-encryption
!
interface GigabitEthernet1/0/11
 description PC-VLAN20 (STUD2)
 switchport mode access
 switchport access vlan 20
!
interface GigabitEthernet1/0/12
 description PC-VLAN10 (STUD1)
 switchport mode access
 switchport access vlan 10
!
interface GigabitEthernet1/0/1
 description Trunk til ST2-A-SW1 Fa0/3
 switchport mode trunk
 switchport trunk allowed vlan 10,20
!
interface GigabitEthernet1/0/2
 description Medlem av Port-channel1
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 channel-group 1 mode active
!
interface GigabitEthernet1/0/3
 description Medlem av Port-channel1
 switchport mode trunk
 switchport trunk allowed vlan 10,20
 channel-group 1 mode active
!
interface Port-channel1
 description EtherChannel til STUD1 ST1-A-SW2
 switchport mode trunk
 switchport trunk allowed vlan 10,20
!
