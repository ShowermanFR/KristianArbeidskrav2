---
# ============================================================
# ST2-C-SW1 – Core L3-switch (Catalyst 3650)
# ============================================================

# Management-porten mot MGMT-PC. Satt av Python-scriptet.
# Står her kun som dokumentasjon – playbookene RØRER DEN IKKE.
mgmt_interface: GigabitEthernet1/0/1   # 10.2.99.1/30

# L3-switch: porter må gjøres om til rutede porter (no switchport)
l3_switch: true

# Rutede porter mot routerne
rutede_porter:
  - navn: GigabitEthernet1/0/2
    beskrivelse: "Til ST2-D-RO1 Gi0/0/0"
    ip: 10.2.0.1
    maske: 255.255.255.252
  - navn: GigabitEthernet1/0/3
    beskrivelse: "Til ST2-D-RO2 Gi0/0"
    ip: 10.2.0.5
    maske: 255.255.255.252

ospf:
  router_id: 2.2.2.1
  nettverk:
    - { nett: 10.2.0.0,  wildcard: 0.0.0.3 }
    - { nett: 10.2.0.4,  wildcard: 0.0.0.3 }
    - { nett: 10.2.99.0, wildcard: 0.0.0.3 }   # management-nettet, så routerne finner veien tilbake
  # Passive på alle, bortsett fra linkene mot routerne
  passive_default: true
  aktive_interfaces:
    - GigabitEthernet1/0/2
    - GigabitEthernet1/0/3
