---
# ============================================================
# Distribution-routere – config fra templates/distribution.j2
# LAN-port i VLAN 20, HSRP, DHCP og OSPF.
#
# Bare lag configen som fil (sender ingenting, trenger ikke passord):
#   ansible-playbook playbooks/distribution.yml --tags generer
# Se hva som vil endres:
#   ansible-playbook playbooks/distribution.yml -k --check --diff
# Send configen (én router om gangen med --limit):
#   ansible-playbook playbooks/distribution.yml -k --limit ST2-D-RO1
# ============================================================
- name: Konfigurer distribution-routere
  hosts: distribution
  gather_facts: false

  vars:
    mal: "{{ playbook_dir }}/../templates/distribution.j2"
    generert_mappe: "{{ playbook_dir }}/../generert"

  tasks:
    - name: Sikkerhetssjekk – management-porten skal aldri stå i rutede_porter
      ansible.builtin.assert:
        that: item.navn != mgmt_interface
        fail_msg: "{{ item.navn }} er management-porten! Fjern den fra rutede_porter."
        quiet: true
      loop: "{{ rutede_porter }}"
      loop_control:
        label: "{{ item.navn }}"
      tags: [generer]

    - name: Lag configen som fil, så du kan lese den før den sendes
      ansible.builtin.template:
        src: "{{ mal }}"
        dest: "{{ generert_mappe }}/{{ inventory_hostname }}.cfg"
      delegate_to: localhost
      check_mode: false   # lag filen også ved --check, den sendes i neste steg
      tags: [generer]

    - name: Banner
      cisco.ios.ios_banner:
        banner: motd
        text: "{{ banner_tekst }}"
        state: present

    # Vi sender den ferdige filen fra generert/, der variablene allerede er fylt inn.
    # (Nyere Ansible fyller ikke inn {{ }} i en fil som ios_config leser selv.)
    - name: Send den genererte configen
      cisco.ios.ios_config:
        src: "{{ generert_mappe }}/{{ inventory_hostname }}.cfg"

    - name: Skru på LAN-portene (no shutdown)
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.navn }}"
            enabled: true
        state: merged
      loop: "{{ rutede_porter }}"
      loop_control:
        label: "{{ item.navn }}"

    - name: Lagre (write memory) hvis noe er endret
      cisco.ios.ios_config:
        save_when: modified
