---
# ============================================================
# Core L3-switch – config fra templates/core.j2
#
# Bare lag configen som fil (sender ingenting, trenger ikke passord):
#   ansible-playbook playbooks/core.yml --tags generer
# Se hva som vil endres på switchen:
#   ansible-playbook playbooks/core.yml -k --check --diff
# Send configen:
#   ansible-playbook playbooks/core.yml -k
# ============================================================
- name: Konfigurer core
  hosts: core
  gather_facts: false

  vars:
    mal: "{{ playbook_dir }}/../templates/core.j2"
    generert_mappe: "{{ playbook_dir }}/../generert"

  tasks:
    - name: Sikkerhetssjekk – management-porten skal aldri stå i rutede_porter
      ansible.builtin.assert:
        that: item.navn != mgmt_interface
        fail_msg: "{{ item.navn }} er management-porten! Fjern den fra rutede_porter."
        quiet: true
      loop: "{{ rutede_porter }}"
      loop_control:
        label: "{{ item.navn }}"
      tags: [generer]

    - name: Lag configen som fil, så du kan lese den før den sendes
      ansible.builtin.template:
        src: "{{ mal }}"
        dest: "{{ generert_mappe }}/{{ inventory_hostname }}.cfg"
      delegate_to: localhost
      check_mode: false   # lag filen også ved --check, den sendes i neste steg
      tags: [generer]

    - name: Banner (egen modul, banner-syntaksen passer dårlig i en mal)
      cisco.ios.ios_banner:
        banner: motd
        text: "{{ banner_tekst }}"
        state: present

    # Vi sender den ferdige filen fra generert/, der variablene allerede er fylt inn.
    # (Nyere Ansible fyller ikke inn {{ }} i en fil som ios_config leser selv.)
    - name: Send den genererte configen
      cisco.ios.ios_config:
        src: "{{ generert_mappe }}/{{ inventory_hostname }}.cfg"

    # "no shutdown" vises ikke i running-config, så i malen ville den gitt
    # "changed" hver gang. ios_interfaces sjekker selv om porten allerede er på.
    - name: Skru på de rutede portene
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.navn }}"
            enabled: true
        state: merged
      loop: "{{ rutede_porter }}"
      loop_control:
        label: "{{ item.navn }}"

    - name: Lagre (write memory) hvis noe er endret
      cisco.ios.ios_config:
        save_when: modified
