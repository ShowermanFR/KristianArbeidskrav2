[defaults]
# Stier her er relative til denne filen, så kjør alltid fra ansible-mappa
inventory = inventory.ini
# Ikke spør "are you sure you want to continue connecting?" for nye enheter
host_key_checking = False
# Skjul advarsler om ting som fjernes i fremtidige versjoner
deprecation_warnings = False

[persistent_connection]
# Gamle enheter er trege – gi dem ekstra tid
command_timeout = 60
connect_timeout = 30
